name: CBP validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install jsonschema==4.26.0
      - name: Unit tests — includes expected failure fixtures
        run: python -m unittest discover -s tests -v
      - name: Validate authoritative manifests and all live submissions
        run: python scripts/validate.py
      - name: Permit contribution-only PRs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/validate.py --check-pr-base "$BASE_SHA"
